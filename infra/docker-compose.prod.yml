services:
  # 1. Base de Datos MySQL 8.0 (Restringida a loopback local 127.0.0.1 y red interna)
  mysql:
    image: mysql:8.0.36
    container_name: chifa_saas_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecureSuperAdminPass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chifa_saas}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - mysql_prod_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chifa_local_net

  # 2. Boveda de Secretos OpenBao (Almacenamiento persistente en Servidor Local)
  openbao:
    image: openbao/openbao:2.0.0
    container_name: chifa_saas_openbao_prod
    restart: always
    environment:
      BAO_ADDR: "http://0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - openbao_prod_data:/openbao/file
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-listen-address="0.0.0.0:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chifa_local_net

  # 3. Monolito Modular Backend (NestJS + WebSockets KDS/Caja)
  backend:
    image: node:22-alpine
    container_name: chifa_saas_backend_prod
    restart: always
    working_dir: /app
    volumes:
      - ../backend:/app
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      OPENBAO_ADDR: http://openbao:8200
    command: sh -c "npm run build && npm run start:prod"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chifa_local_net

  # 4. Cliente Web Universal (Next.js App Router: Caja, KDS 1..N y Comandero Celulares)
  frontend:
    image: node:22-alpine
    container_name: chifa_saas_frontend_prod
    restart: always
    working_dir: /app
    volumes:
      - ../frontend:/app
    environment:
      NODE_ENV: production
      PORT: 3000
    command: sh -c "npm run build && npm run start"
    depends_on:
      - backend
    networks:
      - chifa_local_net

  # 5. Reverse Proxy Local en Red LAN (Unico punto de entrada para PC Caja, KDS y Celulares Wi-Fi)
  nginx:
    image: nginx:1.27-alpine
    container_name: chifa_saas_nginx_lan
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - chifa_local_net

volumes:
  mysql_prod_data:
    name: chifa_mysql_local_prod_volume
  openbao_prod_data:
    name: chifa_openbao_local_prod_volume

networks:
  chifa_local_net:
    name: chifa_saas_local_lan_network
    driver: bridge
